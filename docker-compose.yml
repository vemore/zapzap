services:
  # Local use and CI: this file builds every image. Production runs docker-compose.prod.yml,
  # registry images built and pushed by scripts/deploy_nas.sh (.llmwiki/Deployment.md);
  # keep the two in step.
  #
  # Backend API Service: the Rust backend (zapzap-rust/). The service and container names
  # stay `backend`/`zapzap-backend`: nginx/nginx.conf proxies to `backend:9999` and
  # scripts/deploy_nas.sh's ESSENTIAL_SERVICES names it.
  backend:
    build:
      context: ./zapzap-rust
      dockerfile: Dockerfile
      args:
        # `bedrock` builds the AWS Bedrock client of the LLM bots; production enables them
        - CARGO_FEATURES=bedrock
    container_name: zapzap-backend
    restart: unless-stopped
    environment:
      - PORT=9999
      - DATABASE_URL=sqlite:/app/data/zapzap.db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env (openssl rand -hex 32)}
      - RUST_LOG=${RUST_LOG:-info}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      # The browser origins CORS answers (zapzap-rust/src/infrastructure/cors.rs): passed
      # only when set in .env; unset, every origin (local use). Production's default is in
      # docker-compose.prod.yml.
      - ALLOWED_ORIGINS
      # The pause between two bot actions (zapzap-rust/src/application/bot/runner.rs)
      - BOT_ACTION_DELAY_MS=${BOT_ACTION_DELAY_MS:-1000}
      # LLM bots (.llmwiki/Bots.md): passed only when set in .env, because a variable that
      # is present, even empty, changes what the backend does — AWS_BEDROCK_ENABLED decides
      # alone when present, and an empty AWS_BEDROCK_REGION would replace the default.
      - AWS_BEDROCK_ENABLED
      - AWS_BEDROCK_REGION
      - AWS_BEDROCK_MODEL_ID
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - BOT_STRATEGIES_DIR=/app/data/bot-strategies
    volumes:
      # The image runs as uid 1000: data/, data/zapzap.db and data/bot-strategies/ must be
      # writable by it (the deploy skill's one-time chown).
      - ./data:/app/data
    networks:
      - zapzap-network
    healthcheck:
      # busybox wget: the Alpine image has no curl. 127.0.0.1: the backend listens on IPv4 only.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9999/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Flutter PWA Service (served under /app/ by the proxy)
  frontend-flutter:
    build:
      context: ./frontend-flutter
      dockerfile: Dockerfile
      args:
        # The web OAuth client id (not a secret; the key keeps the name the removed React
        # build gave it); empty → no Google button (frontend-flutter/Dockerfile,
        # .llmwiki/FrontendFlutter.md).
        - GOOGLE_CLIENT_ID=${VITE_GOOGLE_OAUTH_CLIENT_ID}
    container_name: zapzap-frontend-flutter
    restart: unless-stopped
    networks:
      - zapzap-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: zapzap-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/privacy.html:/usr/share/nginx/zapzap/privacy.html:ro
    # No condition on frontend-flutter, deliberately: a PWA that fails its health check
    # would otherwise hold zapzap-proxy in Created and take /api/ down with the web client.
    # The /app/ location resolves the PWA per request instead (nginx/nginx.conf), so a
    # broken PWA is a 502 on the web alone.
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - zapzap-network
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  zapzap-network:
    driver: bridge

volumes:
  data:
