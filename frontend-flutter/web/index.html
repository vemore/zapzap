<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ZapZap - multiplayer card game">
  <meta name="theme-color" content="#0f172a">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ZapZap">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ZapZap</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Holds back Google's GIS script. The google_sign_in_web plugin inserts it when it
    registers, before the app's main, in every build, with or without a client id. It is
    appended only when the app first uses Google sign-in (zapzapLoadGoogleScript, called by
    lib/services/google_sign_in_script_web.dart), so a build without GOOGLE_CLIENT_ID, or a
    signed-in session, never contacts accounts.google.com. .llmwiki/FrontendFlutter.md
  -->
  <script>
    (function () {
      var GIS = 'https://accounts.google.com/gsi/client';
      var appendChild = Node.prototype.appendChild;
      var held = [];
      var released = false;
      Node.prototype.appendChild = function (child) {
        if (!released && child instanceof HTMLScriptElement &&
            String(child.src).indexOf(GIS) === 0) {
          held.push([this, child]);
          return child;
        }
        return appendChild.call(this, child);
      };
      window.zapzapLoadGoogleScript = function () {
        released = true;
        held.splice(0).forEach(function (entry) {
          appendChild.call(entry[0], entry[1]);
        });
      };
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
