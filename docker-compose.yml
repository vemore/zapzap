services:
  # Backend API Service: the Rust backend (zapzap-rust/). The service and container names
  # stay `backend`/`zapzap-backend`: nginx/nginx.conf proxies to `backend:9999` and
  # deploy.sh's ESSENTIAL_SERVICES names it. The Node backend (root Dockerfile, src/) is the
  # rollback: the commit before the switch declares it here (.llmwiki/Deployment.md).
  backend:
    build:
      context: ./zapzap-rust
      dockerfile: Dockerfile
      args:
        # `bedrock` builds the AWS Bedrock client of the LLM bots; production enables them
        - CARGO_FEATURES=bedrock
    container_name: zapzap-backend
    restart: unless-stopped
    environment:
      - PORT=9999
      - DATABASE_URL=sqlite:/app/data/zapzap.db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env (openssl rand -hex 32)}
      - RUST_LOG=${RUST_LOG:-info}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      # The pause between two bot actions (zapzap-rust/src/application/bot/runner.rs);
      # 1000 is Node's default too
      - BOT_ACTION_DELAY_MS=${BOT_ACTION_DELAY_MS:-1000}
      # LLM bots (.llmwiki/Bots.md): passed only when set in .env, because a variable that
      # is present, even empty, changes what the backend does — AWS_BEDROCK_ENABLED decides
      # alone when present, and an empty AWS_BEDROCK_REGION would replace the default.
      - AWS_BEDROCK_ENABLED
      - AWS_BEDROCK_REGION
      - AWS_BEDROCK_MODEL_ID
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - BOT_STRATEGIES_DIR=/app/data/bot-strategies
    volumes:
      # The image runs as uid 1000: data/, data/zapzap.db and data/bot-strategies/ must be
      # writable by it (the deploy skill's one-time chown).
      - ./data:/app/data
    networks:
      - zapzap-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9999/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_GOOGLE_OAUTH_CLIENT_ID=${VITE_GOOGLE_OAUTH_CLIENT_ID}
    container_name: zapzap-frontend
    restart: unless-stopped
    networks:
      - zapzap-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Flutter PWA Service (served under /app/ by the proxy)
  frontend-flutter:
    build:
      context: ./frontend-flutter
      dockerfile: Dockerfile
      args:
        # The web OAuth client id, the React build's own (not a secret); empty → no
        # Google button (frontend-flutter/Dockerfile, .llmwiki/FrontendFlutter.md).
        - GOOGLE_CLIENT_ID=${VITE_GOOGLE_OAUTH_CLIENT_ID}
    container_name: zapzap-frontend-flutter
    restart: unless-stopped
    networks:
      - zapzap-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: zapzap-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # No condition on frontend-flutter, deliberately: a PWA that fails its health check
    # would otherwise hold zapzap-proxy in Created and take the whole site down, since
    # deploy.sh has already stopped the old containers. The /app/ location resolves the
    # PWA per request instead (nginx/nginx.conf), so a broken PWA is a 502 on /app/ only.
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - zapzap-network
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  zapzap-network:
    driver: bridge

volumes:
  data:
