name: zapzap
description: "ZapZap - multiplayer card game client (Android + PWA)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # usePathUrlStrategy (lib/main.dart).
  flutter_web_plugins:
    sdk: flutter
  provider: ^6.1.5+1
  http: ^1.6.0
  go_router: ^18.0.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  flutter_svg: ^2.3.0
  web: ^1.1.1
  # Google sign-in (lib/services/google_sign_in_service.dart); the web
  # package directly for its renderButton (google_sign_in_button_web.dart).
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  fake_async: ^1.3.3
  # The end-to-end test against a live backend (integration_test/,
  # test_driver/; procedure in .llmwiki/Testing.md).
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

flutter:
  uses-material-design: true
  # gen-l10n from lib/l10n/*.arb (l10n.yaml); the generated Dart is not committed.
  generate: true
  # Card faces, one SVG per card id (lib/models/card.dart); licence in THIRD_PARTY.md.
  assets:
    - assets/cards/
