# The setup the three Flutter client jobs of .github/workflows/ci.yml share (`flutter`,
# `flutter-apk`, `flutter-release`), so the SDK pin and the Android toolchain live in one
# place. The `flutter-e2e` job and frontend-flutter/Dockerfile pin the same Flutter
# version on their own: bump the three together (.llmwiki/FrontendFlutter.md).
name: Flutter client setup
description: >-
  Flutter 3.47.2, `pub get --enforce-lockfile` and the generated l10n code in
  frontend-flutter/; with `android: 'true'`, first JDK 17 with the Gradle cache, the
  Gradle heap cap and the pinned Android SDK packages the APK builds need.
inputs:
  android:
    description: "'true' to set up the JDK, Gradle and the Android SDK packages too"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # The Android Gradle plugin (frontend-flutter/android) needs a JDK 17+; the
    # runner's default may change under us, so it is set here. The Android SDK is
    # the runner's preinstalled one ($ANDROID_HOME), with the packages the build needs
    # installed below rather than trusted to the image.
    - if: inputs.android == 'true'
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        cache: gradle
        cache-dependency-path: |
          frontend-flutter/android/*.gradle*
          frontend-flutter/android/gradle/wrapper/gradle-wrapper.properties
    # android/gradle.properties asks for -Xmx8G -XX:MaxMetaspaceSize=4G, more than a
    # standard runner has. The gradle.properties of GRADLE_USER_HOME takes precedence
    # over the project's, so this caps the heap without touching the committed file.
    # Written after setup-java, whose cache covers only ~/.gradle/caches and wrapper.
    - if: inputs.android == 'true'
      name: Cap the Gradle heap for CI
      shell: bash
      run: |
        mkdir -p "$HOME/.gradle"
        {
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"
          echo "kotlin.daemon.jvmargs=-Xmx2g"
          echo "org.gradle.workers.max=2"
        } >> "$HOME/.gradle/gradle.properties"
    # Flutter 3.47's Gradle plugin compiles against SDK 36 (flutter.compileSdkVersion)
    # with build-tools 36.0.0. Accepting the licences also lets the Android Gradle
    # plugin download the pinned NDK if the image lacks it.
    - if: inputs.android == 'true'
      name: Install pinned Android SDK packages
      shell: bash
      run: |
        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        yes | "$SDKMANAGER" --licenses > /dev/null || true
        "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
    # Pinned with the SDK the client is written against (.llmwiki/FrontendFlutter.md):
    # a newer analyzer is a red build.
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.47.2
        channel: stable
        cache: true
    - name: flutter --version
      shell: bash
      run: flutter --version
    # --enforce-lockfile: a pubspec.yaml change committed without its pubspec.lock fails
    # here instead of resolving afresh and passing.
    - name: flutter pub get --enforce-lockfile
      shell: bash
      working-directory: frontend-flutter
      run: flutter pub get --enforce-lockfile
    # lib/l10n/app_localizations*.dart are not committed, and a pub get does not always
    # write them: generated explicitly, or analyze reports every AppLocalizations use.
    - name: flutter gen-l10n
      shell: bash
      working-directory: frontend-flutter
      run: if [ -f l10n.yaml ]; then flutter gen-l10n; fi
