# Nginx Reverse Proxy Configuration for ZapZap

upstream backend {
    server backend:9999;
    keepalive 32;
}

upstream frontend {
    server frontend:80;
}

# No `upstream` block for the Flutter PWA on purpose: a `server <host>` there is resolved
# once, at start-up, so a missing frontend-flutter container would stop nginx from starting
# at all ("host not found in upstream") and take `/` and `/api/` down with it. The /app/
# location below resolves it per request instead, and answers 502 for the PWA alone.

server {
    listen 80;
    server_name localhost;

    # Logging
    access_log /var/log/nginx/zapzap-access.log;
    error_log /var/log/nginx/zapzap-error.log;

    # Increase client body size for file uploads if needed
    client_max_body_size 10M;

    # API routes - proxy to backend
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Server-Sent Events (SSE) endpoint
    location /suscribeupdate {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        # Headers to help upstream proxies understand this is SSE
        proxy_set_header X-Accel-Buffering no;
        add_header X-Accel-Buffering no;
        add_header Cache-Control no-cache;
        add_header Content-Type text/event-stream;

        # SSE specific settings
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Disable request buffering
        proxy_request_buffering off;

        # Keep connection alive
        proxy_set_header Keep-Alive "";
        proxy_socket_keepalive on;

        # Long timeout for SSE (match or exceed upstream proxy timeouts)
        proxy_connect_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;

        # Send keepalive to prevent upstream proxy timeout
        send_timeout 86400s;
        keepalive_timeout 86400s;
    }

    # Flutter PWA - proxy to the frontend-flutter container, which serves the bundle
    # built with --base-href /app/ (frontend-flutter/nginx.conf). Same domain as the API,
    # so the PWA calls it without CORS. The URI is passed through unchanged.
    location = /app {
        # Relative Location: the public scheme and port are the outer proxy's, not this
        # server's, so an absolute redirect would send the browser to http://host/app/.
        absolute_redirect off;
        return 301 /app/$is_args$args;
    }

    location /app/ {
        # Docker's embedded DNS, and the host in a variable: together they make nginx
        # resolve frontend-flutter when a request arrives, not when it starts. A broken or
        # absent PWA container is then a 502 on /app/ only — the React client and the API
        # keep serving.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $flutter_host "frontend-flutter:80";
        # No URI after the host: the request URI is passed through unchanged, which the
        # bundle's /app/ base href and the container's SPA fallback both need.
        proxy_pass http://$flutter_host;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Frontend - proxy to React app
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
