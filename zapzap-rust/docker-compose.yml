services:
  # Rust Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # `bedrock` builds the AWS Bedrock client for the LLM bots
        - CARGO_FEATURES=${CARGO_FEATURES:-}
    container_name: zapzap-rust-backend
    restart: unless-stopped
    environment:
      - PORT=9999
      - DATABASE_URL=sqlite:/app/data/zapzap.db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (openssl rand -hex 32)}
      - RUST_LOG=${RUST_LOG:-info,zapzap_backend=debug}
      # LLM bots (Bots wiki page): passed only when set, since setting one turns a service on
      - AWS_BEDROCK_ENABLED
      - AWS_BEDROCK_REGION
      - AWS_BEDROCK_MODEL_ID
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - OLLAMA_BASE_URL
      - OLLAMA_MODEL
      - ENABLE_LLM_BOTS
      - BOT_STRATEGIES_DIR=/app/data/bot-strategies
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
    volumes:
      - ../data:/app/data
    ports:
      - "9999:9999"
    networks:
      - zapzap-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9999/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Frontend Service (uses parent frontend)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - VITE_GOOGLE_OAUTH_CLIENT_ID=${VITE_GOOGLE_OAUTH_CLIENT_ID}
    container_name: zapzap-frontend
    restart: unless-stopped
    networks:
      - zapzap-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Flutter PWA Service (served under /app/ by the proxy, uses parent frontend-flutter)
  frontend-flutter:
    build:
      context: ../frontend-flutter
      dockerfile: Dockerfile
    container_name: zapzap-frontend-flutter
    restart: unless-stopped
    networks:
      - zapzap-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: zapzap-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # No condition on frontend-flutter, deliberately: a PWA that fails its health check
    # would otherwise hold zapzap-proxy in Created and take the whole site down, since
    # deploy.sh has already stopped the old containers. The /app/ location resolves the
    # PWA per request instead (nginx/nginx.conf), so a broken PWA is a 502 on /app/ only.
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - zapzap-network
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  zapzap-network:
    driver: bridge
