# Nginx Reverse Proxy Configuration for ZapZap

upstream backend {
    server backend:9999;
    keepalive 32;
}

# No `upstream` block for the Flutter PWA on purpose: a `server <host>` there is resolved
# once, at start-up, so a missing frontend-flutter container would stop nginx from starting
# at all ("host not found in upstream") and take `/api/` — the Android app — down with it.
# The /app/ location below resolves it per request instead, and answers 502 for the PWA alone.

# This file is included inside the base nginx:alpine image's `http {}` block
# (/etc/nginx/conf.d/*.conf), so a `log_format` here lives at http scope, as it must.
#
# EventSource cannot set headers, so /suscribeupdate carries its session JWT as
# `?token=...` (zapzap-rust/src/api/sse.rs, frontend-flutter/lib/services/sse_client.dart).
# The default "combined" format logs $request ("GET /suscribeupdate?token=... HTTP/1.1"),
# which would put that token in nginx's access log. This format logs $uri instead — the request path, without the query
# string — for that location only; every other location keeps the server-level
# `access_log` below (the implicit "combined" format, unaffected).
log_format sse_no_token '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent"';

server {
    listen 80;
    server_name localhost;

    # Logging
    access_log /var/log/nginx/zapzap-access.log;
    error_log /var/log/nginx/zapzap-error.log;

    # Increase client body size for file uploads if needed
    client_max_body_size 10M;

    # Every redirect below is relative (`Location: /app/...`): the public scheme and port are
    # the outer proxy's (the Synology reverse proxy terminates HTTPS), not this server's, so
    # an absolute redirect would send the browser to http://<host>/app/.
    absolute_redirect off;

    # API routes - proxy to backend
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Server-Sent Events (SSE) endpoint
    location /suscribeupdate {
        # Overrides the server-level access_log above: the SSE JWT stays in the URL (the
        # backend still requires and verifies it), but it never reaches this log.
        access_log /var/log/nginx/zapzap-access.log sse_no_token;

        proxy_pass http://backend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        # Headers to help upstream proxies understand this is SSE
        proxy_set_header X-Accel-Buffering no;
        add_header X-Accel-Buffering no;
        add_header Cache-Control no-cache;
        add_header Content-Type text/event-stream;

        # SSE specific settings
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Disable request buffering
        proxy_request_buffering off;

        # Keep connection alive
        proxy_set_header Keep-Alive "";
        proxy_socket_keepalive on;

        # Long timeout for SSE (match or exceed upstream proxy timeouts)
        proxy_connect_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;

        # Send keepalive to prevent upstream proxy timeout
        send_timeout 86400s;
        keepalive_timeout 86400s;
    }

    # Flutter PWA - proxy to the frontend-flutter container, which serves the bundle
    # built with --base-href /app/ (frontend-flutter/nginx.conf). Same domain as the API,
    # so the PWA calls it without CORS. The URI is passed through unchanged.
    location = /app {
        return 301 /app/$is_args$args;
    }

    location /app/ {
        # Docker's embedded DNS, and the host in a variable: together they make nginx
        # resolve frontend-flutter when a request arrives, not when it starts. A broken or
        # absent PWA container is then a 502 on /app/ only — the API, and with it the Android
        # app, keeps serving.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $flutter_host "frontend-flutter:80";
        # No URI after the host: the request URI is passed through unchanged, which the
        # bundle's /app/ base href and the container's SPA fallback both need.
        proxy_pass http://$flutter_host;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # The privacy policy (Google Play links to it): a static page baked into this image
    # (nginx/Dockerfile), generated from privacy_policy.md by scripts/build_privacy_page.py.
    # `/privacy.html` too, so a link with the extension works.
    location = /privacy {
        default_type text/html;
        charset utf-8;
        alias /usr/share/nginx/zapzap/privacy.html;
    }
    location = /privacy.html {
        default_type text/html;
        charset utf-8;
        alias /usr/share/nginx/zapzap/privacy.html;
    }

    # The URLs of the React client, removed on 2026-09-29: it served `/` and the paths below,
    # which bookmarks, shared lobby links, the Play listing and privacy_policy.md still name.
    # Each one answers a permanent redirect to its page in the PWA, query string kept
    # (scripts/proxy_redirects_smoke.sh pins every one). The React routes that are named
    # differently in the PWA (frontend-flutter/lib/router.dart, AppRoutes) get their own
    # location; every other path is the PWA's own under /app/ (/login, /register, /parties,
    # /game/<id>, /history, /history/<id>, /stats, /admin, /admin/<tab>), and a path the PWA
    # does not know lands on its own not-found handling rather than on a proxy 404.
    location = / {
        return 301 /app/$is_args$args;
    }
    # A party's lobby: /party/<id> → /parties/<id>. The id is captured from the decoded URI,
    # so it is restricted to the characters an id has; anything else falls through to
    # `location /` below, which copies the raw request URI instead.
    location ~ ^/party/([A-Za-z0-9_-]+)/?$ {
        return 301 /app/parties/$1$is_args$args;
    }
    location = /create-party {
        return 301 /app/parties/new$is_args$args;
    }
    # The web page for deleting an account, named in the Play listing and privacy_policy.md:
    # the PWA's account page, which holds the deletion.
    location = /account/delete {
        return 301 /app/account$is_args$args;
    }
    # $request_uri is the path as the browser sent it, query string included; prefixed with
    # /app it stays a path on this host, whatever it holds (`//host` included).
    location / {
        return 301 /app$request_uri;
    }

    # Health check endpoint
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
