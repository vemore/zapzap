# Nginx configuration of the ZapZap Flutter PWA image.
#
# The bundle is built with `--base-href /app/` and lives under /app/ here, so a request the
# production proxy forwards unchanged (nginx/nginx.conf) resolves without a rewrite.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;

    # The container health check. The production proxy routes /app only, so this stays
    # inside the compose network.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    # Without the trailing slash the base href would resolve against /, not /app/.
    location = /app {
        # Relative Location: the public scheme, host and port are the proxy's.
        absolute_redirect off;
        return 301 /app/;
    }

    # The entry points carry the build's identity and are not content-hashed: a stale copy
    # is a broken app after a deploy, so they are never stored.
    location ~ ^/app/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js)$ {
        # No `expires`: it emits a Cache-Control of its own, and the response would carry
        # two of them.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # The build's own files: a missing one is a 404, never the SPA fallback below — an
    # asset loader served index.html fails much later and much less clearly.
    location ~ ^/app/(assets|canvaskit)/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The rest of the bundle (main.dart.js, canvaskit/, assets/) is not content-hashed
    # either, and Flutter 3.47's service worker caches nothing (it unregisters itself), so
    # nothing may be served from the browser cache without revalidating. `no-cache` still
    # allows a 304 on the large files.
    #
    # The last entry is the SPA fallback: a deep link such as /app/parties is served
    # index.html instead of 404. The internal redirect re-enters the location above, so the
    # fallback response is the uncached one.
    location /app/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /app/index.html;
    }
}
