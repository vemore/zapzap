name: zapzap
description: "ZapZap - multiplayer card game client (Android + PWA)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5+1
  http: ^1.6.0
  go_router: ^18.0.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  flutter_svg: ^2.3.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  # gen-l10n from lib/l10n/*.arb (l10n.yaml); the generated Dart is not committed.
  generate: true
