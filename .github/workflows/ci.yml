name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel superseded PR runs; never cancel a run for a commit already on master,
# so master keeps a complete green/red record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which of the jobs below this change actually needs. Fail-safe: when this job
  # fails, is cancelled, or writes no output, every job runs.
  scope:
    name: Scope — which jobs this change needs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A job-level permissions block replaces the workflow's: contents: read is
    # repeated here, or actions/checkout fails.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.flags.outputs.rust }}
      native: ${{ steps.flags.outputs.native }}
      frontend: ${{ steps.flags.outputs.frontend }}
      image: ${{ steps.flags.outputs.image }}
      hooks: ${{ steps.flags.outputs.hooks }}
      flutter: ${{ steps.flags.outputs.flutter }}
      node: ${{ steps.flags.outputs.node }}
    steps:
      - uses: actions/checkout@v4

      # The classifier decides what is *not* built, so it is tested first: a broken
      # classifier fails this job, which runs everything.
      - name: Scope classifier self-test
        run: scripts/ci_scope_selftest.sh

      # On master and on a manual run every flag is true. On a pull request the flags
      # come from the files it changes (`.previous_filename` so a rename is judged on
      # both sides). Never add `|| true` here: failing is how everything gets run.
      - name: Which jobs this change needs
        id: flags
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          all='rust=true\nnative=true\nfrontend=true\nimage=true\nhooks=true\nflutter=true\nnode=true\n'
          if [ "$EVENT" != pull_request ]; then
            printf "$all" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$REPO/pulls/$PR/files?per_page=100" --paginate \
            -q '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
          n=$(grep -c . "$RUNNER_TEMP/changed.txt" || true)
          echo "$n changed path(s):"
          sed 's/^/  /' "$RUNNER_TEMP/changed.txt"
          # The endpoint stops listing at 3000 files without an error.
          if [ "$n" -ge 3000 ]; then
            printf "$all" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          scripts/ci_scope.sh < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"

  # Every job below: `!cancelled()` is load-bearing. `needs:` adds an implicit
  # success(), dropped only when the expression holds a status function; without it
  # a failed `scope` would skip the job, and a job skipped by `if:` reports Success,
  # which satisfies branch protection. `!= 'false'` rather than `== 'true'` so an
  # output-less scope runs everything. Never a workflow-level `paths:` filter: a
  # filtered workflow reports no status, and a required check that never reports
  # leaves a pull request waiting forever.

  rust:
    name: Rust backend — fmt, clippy, test
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: zapzap-rust
    steps:
      - uses: actions/checkout@v4
      # Pinned with rust-toolchain.toml in the crate: a newer clippy is a red build.
      - uses: dtolnay/rust-toolchain@1.92
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zapzap-rust
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Unit and integration tests: tests/api_tests.rs drives the router on an in-memory
      # SQLite, tests/schema_tests.rs checks the schema against the Node DDL in ../src.
      - run: cargo test --locked --lib --bins --tests

  native:
    # Branch protection requires this exact check name: rename it there first.
    name: Native engine — fmt, build, test
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.native != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      # Pinned with rust-toolchain.toml in the crate: a newer clippy is a red build.
      - uses: dtolnay/rust-toolchain@1.92
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  frontend:
    name: Frontend — build
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.frontend != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The job's `name:` stays "Frontend — build": branch protection pins it (see `image`).
      - name: Lint
        run: npm run lint
      - name: Unit tests (vitest)
        run: npx vitest run
      - run: npm run build

  image:
    # This `name:` is the check context `master`'s branch protection requires, character
    # for character. Rename it and the required context never reports: every pull request
    # is then blocked from merging for ever, with no failing check to point at. The job
    # builds the Flutter PWA image and validates the proxy configuration too — say that in
    # a step name, never here. Same warning in .llmwiki/Testing.md.
    name: Images — backend and frontend build
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.image != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # nginx/nginx.conf is baked into no image, only mounted by compose, so nothing else
      # reads it before production does: a typo there is a crash-looping proxy after
      # deploy.sh has stopped the old containers. --add-host: nginx resolves the hosts of
      # its upstream blocks when it loads the configuration.
      - name: Proxy configuration is valid
        run: |
          docker run --rm \
            --add-host backend:127.0.0.1 --add-host frontend:127.0.0.1 \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t
      - name: Backend image
        run: docker build -t zapzap-rust-backend:ci zapzap-rust
      # The image production runs today (.llmwiki/Deployment.md): node:20-alpine, whose npm
      # 10 runs `npm ci --only=production`. A package-lock.json a newer local npm accepts
      # but npm 10 does not (#39: "Missing: picomatch@4.0.7 from lock file") fails here,
      # not on the NAS.
      - name: Node backend image (production)
        run: docker build -t zapzap-node-backend:ci .
      - name: Frontend image
        run: docker build -t zapzap-frontend:ci frontend
      # The Flutter SDK is downloaded and checksum-checked inside the image; the version
      # is the one the flutter job pins (frontend-flutter/Dockerfile).
      - name: Flutter PWA image
        run: docker build -t zapzap-frontend-flutter:ci frontend-flutter
      # The acceptance of the PWA deploy: the image serves /app/ and a deep link under it,
      # and never lets a browser keep the entry points.
      - name: Flutter PWA image serves /app/ and its deep links
        run: scripts/pwa_image_smoke.sh zapzap-frontend-flutter:ci

  hooks:
    name: Hooks — self-test
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.hooks != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The table drives the guards with payloads in sandbox repositories and a
      # stubbed gh, cargo, npm and flutter: nothing is built and nothing leaves the runner.
      - run: scripts/hooks_selftest.sh

  flutter:
    name: Flutter client — analyze, test, build web and apk
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.flutter != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend-flutter
    steps:
      - uses: actions/checkout@v4
      # The Android Gradle plugin (frontend-flutter/android) needs a JDK 17+; the
      # runner's default may change under us, so it is set here. The Android SDK is
      # the runner's preinstalled one ($ANDROID_HOME).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            frontend-flutter/android/*.gradle*
            frontend-flutter/android/gradle/wrapper/gradle-wrapper.properties
      # Pinned with the SDK the client is written against (.llmwiki/FrontendFlutter.md):
      # a newer analyzer is a red build.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter --version
      # --enforce-lockfile: a pubspec.yaml change committed without its pubspec.lock fails
      # here instead of resolving afresh and passing.
      - run: flutter pub get --enforce-lockfile
      # lib/l10n/app_localizations*.dart are not committed, and a pub get does not always
      # write them: generated explicitly, or analyze reports every AppLocalizations use.
      - run: if [ -f l10n.yaml ]; then flutter gen-l10n; fi
      - run: flutter analyze
      - run: flutter test
      # The PWA is served under /app/ on the API's own domain, CanvasKit included: the same
      # flags the image builds with (frontend-flutter/Dockerfile), so this job fails on
      # whatever the image would fail on.
      - run: flutter build web --base-href /app/ --no-web-resources-cdn
      - run: flutter build apk --debug

  node:
    name: Node backend — jest
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.node != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The major the production image runs (Dockerfile: node:20-alpine).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # tests/unit and tests/integration against src/, the code production runs;
      # jest.config.js keeps tests/e2e (Playwright) and frontend/ (vitest) out.
      - run: npm test
