name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel superseded PR runs; never cancel a run for a commit already on master,
# so master keeps a complete green/red record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which of the jobs below this change actually needs. Fail-safe: when this job
  # fails, is cancelled, or writes no output, every job runs.
  scope:
    name: Scope — which jobs this change needs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A job-level permissions block replaces the workflow's: contents: read is
    # repeated here, or actions/checkout fails.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.flags.outputs.rust }}
      native: ${{ steps.flags.outputs.native }}
      image: ${{ steps.flags.outputs.image }}
      hooks: ${{ steps.flags.outputs.hooks }}
      flutter: ${{ steps.flags.outputs.flutter }}
      e2e: ${{ steps.flags.outputs.e2e }}
      android: ${{ steps.flags.outputs.android }}
    steps:
      - uses: actions/checkout@v4

      # The classifier decides what is *not* built, so it is tested first: a broken
      # classifier fails this job, which runs everything.
      - name: Scope classifier self-test
        run: scripts/ci_scope_selftest.sh

      # On master and on a manual run every flag is true. On a pull request the flags
      # come from the files it changes (`.previous_filename` so a rename is judged on
      # both sides). Never add `|| true` here: failing is how everything gets run.
      - name: Which jobs this change needs
        id: flags
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          all='rust=true\nnative=true\nimage=true\nhooks=true\nflutter=true\ne2e=true\nandroid=true\n'
          if [ "$EVENT" != pull_request ]; then
            printf "$all" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$REPO/pulls/$PR/files?per_page=100" --paginate \
            -q '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
          n=$(grep -c . "$RUNNER_TEMP/changed.txt" || true)
          echo "$n changed path(s):"
          sed 's/^/  /' "$RUNNER_TEMP/changed.txt"
          # The endpoint stops listing at 3000 files without an error.
          if [ "$n" -ge 3000 ]; then
            printf "$all" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          scripts/ci_scope.sh < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"

  # Every job below: `!cancelled()` is load-bearing. `needs:` adds an implicit
  # success(), dropped only when the expression holds a status function; without it
  # a failed `scope` would skip the job, and a job skipped by `if:` reports Success,
  # which satisfies branch protection. `!= 'false'` rather than `== 'true'` so an
  # output-less scope runs everything. Never a workflow-level `paths:` filter: a
  # filtered workflow reports no status, and a required check that never reports
  # leaves a pull request waiting forever.

  rust:
    # Branch protection requires this exact check name: rename it there first.
    name: Rust backend — fmt, clippy, test
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: zapzap-rust
    steps:
      - uses: actions/checkout@v4
      # Pinned with rust-toolchain.toml in the crate: a newer clippy is a red build.
      - uses: dtolnay/rust-toolchain@1.92
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zapzap-rust
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # The `bedrock` feature (the AWS Bedrock client of the LLM bots) is what production
      # builds (docker-compose.yml's CARGO_FEATURES): it is linted too, not only compiled
      # by the image job.
      - name: cargo clippy --features bedrock
        run: cargo clippy --locked --all-targets --features bedrock -- -D warnings
      # Unit and integration tests: tests/api_tests.rs drives the router on an in-memory
      # SQLite, tests/schema_tests.rs checks the schema against a frozen Node-built one.
      - run: cargo test --locked --lib --bins --tests

  native:
    # Branch protection requires this exact check name: rename it there first.
    name: Native engine — fmt, build, test
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.native != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      # Pinned with rust-toolchain.toml in the crate: a newer clippy is a red build.
      - uses: dtolnay/rust-toolchain@1.92
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  image:
    # This `name:` is the check context `master`'s branch protection requires, character
    # for character. Rename it and the required context never reports: every pull request
    # is then blocked from merging for ever, with no failing check to point at. The job
    # builds the Flutter PWA image and validates the proxy configuration too, and no React
    # image since 2026-09-29 — say that in a step name, never here. Same warning in
    # .llmwiki/Testing.md.
    name: Images — backend and frontend build
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.image != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # The proxy image serves nginx/privacy.html at /privacy, the policy Google Play links
      # to: it is rendered from privacy_policy.md, and a page that says something else than
      # the policy fails here. pandoc at the version the script pins (PANDOC_VERSION):
      # another one renders the same Markdown differently.
      - name: Privacy page matches privacy_policy.md
        run: |
          v=$(sed -n 's/^PANDOC_VERSION = "\(.*\)"$/\1/p' scripts/build_privacy_page.py)
          curl -fsSL -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/$v/pandoc-$v-1-amd64.deb"
          sudo dpkg -i /tmp/pandoc.deb
          python3 scripts/build_privacy_page.py --check
      # The production proxy is nginx:alpine with nginx/nginx.conf baked in (nginx/Dockerfile,
      # pushed as zapzap-proxy by scripts/deploy_nas.sh). A typo in the conf is a
      # crash-looping proxy after the deploy has stopped the old containers, so nginx -t runs
      # in the very image. --add-host: nginx resolves the hosts of its upstream blocks when
      # it loads the configuration.
      - name: Proxy image builds and its configuration is valid
        run: |
          docker build -t zapzap-proxy:ci nginx
          docker run --rm --add-host backend:127.0.0.1 zapzap-proxy:ci nginx -t
      # The proxy's routing, on the real configuration between a stub backend and a stub
      # PWA: every URL of the removed React client answers a relative 301 to its page under
      # /app/, query string kept, and /api/, /suscribeupdate, /app/, /privacy and
      # /nginx-health are served as before.
      - name: Proxy routes — React URLs redirect to the PWA, the rest unchanged
        run: scripts/proxy_redirects_smoke.sh zapzap-proxy:ci
      # Both compose files parse, and their backend service still requires JWT_SECRET:
      # production's .env provides it, and the Rust backend has no default. The root one
      # builds (local use, CI); docker-compose.prod.yml is what the NAS runs, registry
      # images only.
      - name: Compose files are valid (root and production)
        run: |
          for f in docker-compose.yml docker-compose.prod.yml; do
            JWT_SECRET=ci-only docker compose -f "$f" config --quiet
            if docker compose -f "$f" config --quiet 2>/dev/null; then
              echo "$f accepts a missing JWT_SECRET" >&2; exit 1
            fi
          done
      # A layer cache for the backend image, the job's longest build (a release build of
      # the AWS SDK, ~8 min cold). A builder of its own (`use: false`): made the default,
      # its docker-container driver would leave the plain `docker build`s of this job
      # without a loaded image. The runtime step exposes ACTIONS_RUNTIME_TOKEN and
      # ACTIONS_RESULTS_URL to `run:` steps, which the buildx `gha` cache needs.
      - name: Buildx builder for the backend image cache
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          use: false
      - uses: crazy-max/ghaction-github-runtime@v3
      # The image production runs (.llmwiki/Deployment.md): the root compose's `backend`
      # service, the Rust backend built with the Bedrock client of the LLM bots. The script
      # builds it from the compose file (buildx bake, with the GitHub Actions layer cache),
      # starts it on an empty database with a throwaway secret, and waits for its own
      # compose health check (busybox wget: the Alpine image has no curl), then checks the
      # image user (uid 1000), its CA store and its size (< 40 MB).
      - name: Rust backend image (production, bedrock, layer-cached) builds and passes its health check
        env:
          SMOKE_BUILDER: ${{ steps.buildx.outputs.name }}
          SMOKE_CACHE_FROM: type=gha,scope=zapzap-backend-image
          SMOKE_CACHE_TO: type=gha,scope=zapzap-backend-image,mode=max
        run: scripts/backend_image_smoke.sh
      # The Flutter SDK is downloaded and checksum-checked inside the image; the version
      # is the one the Flutter jobs pin (frontend-flutter/Dockerfile). This is CI's only
      # release build of the web bundle (`flutter build web --base-href /app/
      # --no-web-resources-cdn`; flutter-e2e compiles a debug one), so a Dart change that
      # breaks the web build fails here.
      - name: Flutter PWA image (CI's release web build)
        run: docker build -t zapzap-frontend-flutter:ci frontend-flutter
      # The acceptance of the PWA deploy: the image serves /app/ and a deep link under it,
      # and never lets a browser keep the entry points.
      - name: Flutter PWA image serves /app/ and its deep links
        run: scripts/pwa_image_smoke.sh zapzap-frontend-flutter:ci

  hooks:
    # Branch protection requires this exact check name: rename it there first.
    name: Hooks — self-test
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.hooks != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The table drives the guards with payloads in sandbox repositories and a
      # stubbed gh, cargo, npm, flutter and dart: nothing is built and nothing leaves the runner.
      - run: scripts/hooks_selftest.sh
      # The production deploy (scripts/deploy_nas.sh), with ssh, docker and docker-compose
      # stubbed: its refusals, the order pull/down/up, the health wait, --rollback.
      - name: Deploy script self-test
        run: scripts/deploy_nas_selftest.sh
      # scripts/wiki_lint.sh is a report, not a gate: the real wiki fails it (a page over
      # budget, status blocks not folded back). Only its self-test, on a throwaway fixture
      # wiki with a known answer, runs here (.llmwiki/Documentation.md, Wiki lint).
      - name: Wiki lint self-test
        run: scripts/wiki_lint_selftest.sh
      # scripts/wip.sh refine on a fixture wip/: section spellings, the per-Area todo/ count.
      - name: wip.sh self-test
        run: scripts/wip_selftest.sh
      # scripts/delivery_metrics.sh on a throwaway repository with a known answer and a
      # stubbed gh (.llmwiki/ParallelDelivery.md § Measuring delivery).
      - name: Delivery metrics self-test
        run: scripts/delivery_metrics_selftest.sh
      # The agent evals' checks (evals/, .llmwiki/AgentEvals.md): each judges its untouched
      # tree, its good.sh and its bad.sh right, in throwaway worktrees off HEAD. No agent and
      # no claude CLI: the real runs are local, on the user's login.
      - name: Agent evals self-test
        run: evals/selftest.sh
      # The Play release scripts (release-android skill): play_publish.py against a fake
      # Google service, verify_aab.sh against fake bundles signed by throwaway keystores.
      # No Google key and no upload key are ever in CI; these only prove the refusals.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: astral-sh/setup-uv@v6
      - name: Play release scripts — play_publish.py and verify_aab.sh tests
        env:
          VERIFY_AAB_REQUIRE_TOOLS: "1"
        run: uv run --no-project --with pytest pytest -q scripts/test_play_publish.py scripts/test_verify_aab.py
      # scripts/agent_metrics.py reads the local Claude Code transcripts; its tests build a
      # synthetic projects directory, and check no transcript content reaches the output.
      - name: Agent metrics tests
        run: uv run --no-project --with pytest pytest -q scripts/test_agent_metrics.py
      # scripts/arb_keys.py (the i18n-add-string skill's check) on fixture ARB files, and the
      # committed ARB files' key sets. Its value report is not a gate.
      - name: ARB checker tests — arb_keys.py
        run: uv run --no-project --with pytest pytest -q scripts/test_arb_keys.py

  # The Flutter client in three parallel jobs, so a Flutter pull request waits for the
  # longest of them rather than for their sum (one serial job took ~9 min, 2026-09-29):
  # analyze and test here, the debug APK in `flutter-apk`, the R8 release build in
  # `flutter-release`. The web bundle has no build of its own: the `image` job's Flutter
  # PWA image builds it, with the flags production uses, on every change under
  # frontend-flutter/. Their shared setup is .github/actions/flutter-setup.
  flutter:
    # Not a required check, but its name is kept verbatim all the same (the rule of the
    # pinned names, .llmwiki/Testing.md): it no longer builds the web bundle nor the APKs,
    # which the `image` job and the two jobs below do.
    name: Flutter client — analyze, test, build web and apk
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.flutter != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend-flutter
    steps:
      - uses: actions/checkout@v4
      # No JDK and no Android SDK: analyze and test need neither.
      - name: Flutter SDK, pub get, gen-l10n
        uses: ./.github/actions/flutter-setup
      # The commit hook runs the same check (.llmwiki/Hooks.md); fix with `dart format lib test`.
      - name: dart format --set-exit-if-changed
        run: dart format --output=none --set-exit-if-changed lib test $([ -d integration_test ] && echo integration_test)
      - run: flutter analyze
      - run: flutter test

  # The debug APK, on every Flutter change: the one the flutter-device-test skill
  # installs. CI holds no upload key (.llmwiki/FrontendFlutter.md § Android). It talks to
  # production over HTTPS by default (lib/services/api_config.dart).
  flutter-apk:
    name: Flutter Android — debug APK (artifact app-debug)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.flutter != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend-flutter
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17, Android SDK packages, Flutter SDK, pub get, gen-l10n
        uses: ./.github/actions/flutter-setup
        with:
          android: "true"
      - run: flutter build apk --debug
      # The APK to try on a phone: the run's page → Artifacts → app-debug (a zip holding
      # app-debug.apk), or `gh run download <run id> -n app-debug`.
      - name: Upload the debug APK (artifact app-debug)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: frontend-flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  # The release build and its signing rules, on the `android` flag only: a change under
  # frontend-flutter/android/ (Gradle, the R8 keep rules, the manifest), to pubspec.yaml
  # or pubspec.lock (a plugin's Android code), and every push to master. R8 shrinks the
  # Java and Kotlin classes, not the Dart code, which the two jobs above cover.
  flutter-release:
    name: Flutter Android — R8 release build, unsigned bundle refused
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.android != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend-flutter
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17, Android SDK packages, Flutter SDK, pub get, gen-l10n
        uses: ./.github/actions/flutter-setup
        with:
          android: "true"
      # The release build with R8 (minify, shrink, android/app/proguard-rules.pro), and with
      # no android/key.properties here: it must fall back to the debug key and still build.
      - name: Release build without key.properties (R8, debug-key fallback)
        run: flutter build apk --release
      # A Play bundle is never debug-signed: without key.properties, `flutter build
      # appbundle` must fail, before any task runs, naming the file.
      - name: Release bundle without key.properties is refused
        run: |
          if flutter build appbundle --release > appbundle.log 2>&1; then
            cat appbundle.log; echo "appbundle built without key.properties"; exit 1
          fi
          grep -F "No android/key.properties: a release bundle" appbundle.log

  # The Flutter end-to-end test (frontend-flutter/integration_test/): the real client, in
  # headless Chrome, registers a user and plays a round against two bots on a Rust backend
  # started here on an empty database (scripts/flutter_e2e.sh). It runs on the `e2e` flag:
  # a Flutter change, and a change to the Rust backend production runs. Not a required
  # check: its name is free to change until branch protection pins it.
  flutter-e2e:
    name: Flutter end to end — a round against the Rust backend
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.e2e != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zapzap-rust
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Build the Rust backend (debug)
        working-directory: zapzap-rust
        run: cargo build --locked
      - name: flutter pub get and gen-l10n
        working-directory: frontend-flutter
        run: |
          flutter pub get --enforce-lockfile
          if [ -f l10n.yaml ]; then flutter gen-l10n; fi
      # The runner's Chrome and its matching chromedriver ($CHROMEWEBDRIVER); the backend
      # gets a fresh database, seeded by `zapzap-backend seed`, and a generated
      # JWT_SECRET, both gone with the job.
      - name: Seed the bots, start the backend and chromedriver, flutter drive
        run: scripts/flutter_e2e.sh
