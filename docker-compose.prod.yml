# Production compose for the NAS. scripts/deploy_nas.sh copies it to the deploy directory
# ($NAS_DEPLOY_DIR/compose.yaml, next to the production .env and data/) with the registry
# and the tag written in literally, so the file on the NAS names exactly the images that
# run: <registry>/zapzap-*:<short sha>. `--rollback <sha>` rewrites those tags in place.
#
# Nothing is built here: every image is built on the dev machine and pulled from the LAN
# registry. The root docker-compose.yml, which builds, stays for local use and CI.
#
# The NAS runs docker-compose 1.29.2 (v1): no top-level `name:`, and the project name comes
# from COMPOSE_PROJECT_NAME=zapzap, which deploy_nas.sh exports.
#
# Service names are load-bearing: nginx/nginx.conf proxies to `backend`, `frontend` and
# `frontend-flutter`, and ESSENTIAL_SERVICES / PROXY_SERVICE in scripts/deploy_nas.sh name
# `backend`, `frontend` and `nginx`. Rename them together or not at all.
services:
  # The Rust backend (zapzap-rust/), built with CARGO_FEATURES=bedrock.
  backend:
    image: ${ZAPZAP_REGISTRY:-192.168.1.25:5050}/zapzap-backend:${ZAPZAP_TAG:-latest}
    container_name: zapzap-backend
    restart: unless-stopped
    environment:
      - PORT=9999
      - DATABASE_URL=sqlite:/app/data/zapzap.db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env (openssl rand -hex 32)}
      - RUST_LOG=${RUST_LOG:-info}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      # The pause between two bot actions (zapzap-rust/src/application/bot/runner.rs)
      - BOT_ACTION_DELAY_MS=${BOT_ACTION_DELAY_MS:-1000}
      # LLM bots (.llmwiki/Bots.md): passed only when set in .env, because a variable that
      # is present, even empty, changes what the backend does — AWS_BEDROCK_ENABLED decides
      # alone when present, and an empty AWS_BEDROCK_REGION would replace the default.
      - AWS_BEDROCK_ENABLED
      - AWS_BEDROCK_REGION
      - AWS_BEDROCK_MODEL_ID
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - BOT_STRATEGIES_DIR=/app/data/bot-strategies
    volumes:
      # data/ of the deploy directory. The image runs as uid 1000: data/, data/zapzap.db and
      # data/bot-strategies/ must be writable by it (deploy_nas.sh refuses otherwise).
      - ./data:/app/data
    networks:
      - zapzap-network
    healthcheck:
      # The Alpine image carries busybox wget, not curl; 127.0.0.1, since localhost may be ::1.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9999/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # The React client, served on /
  frontend:
    image: ${ZAPZAP_REGISTRY:-192.168.1.25:5050}/zapzap-frontend:${ZAPZAP_TAG:-latest}
    container_name: zapzap-frontend
    restart: unless-stopped
    networks:
      - zapzap-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # The Flutter PWA, served under /app/ by the proxy
  frontend-flutter:
    image: ${ZAPZAP_REGISTRY:-192.168.1.25:5050}/zapzap-frontend-flutter:${ZAPZAP_TAG:-latest}
    container_name: zapzap-frontend-flutter
    restart: unless-stopped
    networks:
      - zapzap-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # The reverse proxy: nginx:alpine with nginx/nginx.conf baked in (nginx/Dockerfile)
  nginx:
    image: ${ZAPZAP_REGISTRY:-192.168.1.25:5050}/zapzap-proxy:${ZAPZAP_TAG:-latest}
    container_name: zapzap-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-80}:80"
    # No condition on frontend-flutter, deliberately: a PWA that fails its health check
    # would otherwise hold zapzap-proxy in Created and take the whole site down, since
    # deploy_nas.sh has already stopped the old containers. The /app/ location resolves the
    # PWA per request instead (nginx/nginx.conf), so a broken PWA is a 502 on /app/ only.
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - zapzap-network
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  zapzap-network:
    driver: bridge
